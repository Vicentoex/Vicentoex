<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 116" width="896" height="116" role="img" aria-labelledby="wf-light-title">
  <title id="wf-light-title">Flujo metodológico: Psicología y Neuropsicología hacia Workflows con IA y herramientas aplicadas</title>
  <rect x="0.5" y="0.5" width="895" height="115" rx="12" fill="#f2f5f3" stroke="#cfd8d4" stroke-width="1"/>

  <!-- Step 1 -->
  <g transform="translate(20, 20)">
    <rect x="0.5" y="0.5" width="252" height="75" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1"/>
    <text x="16" y="25" fill="#1f6e4a" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">ENTRADA · BASE CIENTÍFICA</text>
    <text x="16" y="46" fill="#16201c" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Psicología y Neuropsicología</text>
    <text x="16" y="63" fill="#42504a" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5">Cómo atendemos, retenemos y decidimos</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g>
    <line x1="278" y1="58" x2="316" y2="58" stroke="#1f6e4a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="315,54 323,58 315,62" fill="#1f6e4a"/>
    <circle cx="288" cy="58" r="2.5" fill="#1f6e4a">
      <animate attributeName="cx" values="280;312;280" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Step 2 -->
  <g transform="translate(326, 20)">
    <rect x="0.5" y="0.5" width="244" height="75" rx="8" fill="#ffffff" stroke="#b9c6c0" stroke-width="1"/>
    <text x="16" y="25" fill="#8a5a0e" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">SÍNTESIS · MÉTODO</text>
    <text x="16" y="46" fill="#16201c" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Workflows con IA</text>
    <text x="16" y="63" fill="#42504a" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5">Prompts, scripts y flujos reproducibles</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g>
    <line x1="576" y1="58" x2="614" y2="58" stroke="#8a5a0e" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="613,54 621,58 613,62" fill="#8a5a0e"/>
    <circle cx="588" cy="58" r="2.5" fill="#8a5a0e">
      <animate attributeName="cx" values="578;610;578" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Step 3 -->
  <g transform="translate(624, 20)">
    <rect x="0.5" y="0.5" width="252" height="75" rx="8" fill="#ffffff" stroke="#cfd8d4" stroke-width="1"/>
    <text x="16" y="25" fill="#1f6e4a" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">SALIDA · UTILIDAD REAL</text>
    <text x="16" y="46" fill="#16201c" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Herramientas aplicadas</text>
    <text x="16" y="63" fill="#42504a" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5">Estudio, claridad diaria y talento (RRHH)</text>
  </g>
</svg>
