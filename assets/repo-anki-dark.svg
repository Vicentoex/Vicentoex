<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 248" width="740" height="248" role="img" aria-labelledby="anki-dark-title">
  <title id="anki-dark-title">Repositorio público Vicentoex/Anki: Anki Prompt y Anki Tarjet Script con curva animada de repetición espaciada</title>
  <rect x="0.5" y="0.5" width="739" height="247" rx="16" fill="#0c1311" stroke="#26322e" stroke-width="1"/>

  <!-- Left Info Side -->
  <g transform="translate(26, 26)">
    <rect x="0.5" y="0.5" width="258" height="28" rx="14" fill="#121c19" stroke="#2c3d37" stroke-width="1"/>
    <circle cx="17" cy="14.5" r="4" fill="#7de0ae">
      <animate attributeName="opacity" values="0.72;1;0.72" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18.5" fill="#b4c6bd" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">REPOSITORIO PÚBLICO · ACTIVO</text>

    <text x="0" y="68" fill="#ebf2ee" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="25.5" font-weight="700">Vicentoex / Anki</text>

    <text x="0" y="102" fill="#c2d3ca" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16.5">Anki Prompt y Anki Tarjet Script:</text>
    <text x="0" y="126" fill="#c2d3ca" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16.5">plantillas de prompts y scripts para</text>
    <text x="0" y="150" fill="#c2d3ca" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16.5">generar tarjetas de recuerdo activo.</text>

    <text x="0" y="192" fill="#8da399" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Markdown · Python</text>
    <text x="374" y="192" text-anchor="end" fill="#7de0ae" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700">Ver repositorio →</text>
  </g>

  <!-- Right Retention Curve Side (Snapped exact vertices: D1=84, D3=148, D7=212, D21=270) -->
  <g transform="translate(422, 22)">
    <rect x="0.5" y="0.5" width="293" height="203" rx="12" fill="#121c19" stroke="#26322e" stroke-width="1"/>
    <text x="18" y="28" fill="#b4c6bd" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">RETENCIÓN · REPASO ESPACIADO</text>

    <!-- Baseline and upper reference -->
    <line x1="20" y1="158" x2="274" y2="158" stroke="#22302b" stroke-width="1.2"/>
    <line x1="20" y1="68" x2="274" y2="68" stroke="#1b2622" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- Faint forgetting curve -->
    <path d="M 24 62 C 62 114, 130 144, 270 153" fill="none" stroke="#4c5f57" stroke-width="1.5" stroke-dasharray="3 4"/>

    <!-- Vertical guides snapped to exact peak vertices -->
    <line x1="84" y1="62" x2="84" y2="158" stroke="#26322e" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="148" y1="58" x2="148" y2="158" stroke="#26322e" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="212" y1="56" x2="212" y2="158" stroke="#26322e" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="270" y1="66" x2="270" y2="158" stroke="#26322e" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Reinforced spaced-repetition retention wave snapped to exact vertices -->
    <path d="M 24 62 Q 48 104, 74 108 L 84 62 Q 112 92, 138 94 L 148 58 Q 176 80, 202 82 L 212 56 Q 242 65, 270 66"
      fill="none" stroke="#5cbf8f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pulsing recall nodes snapped to exact vertices -->
    <circle cx="84" cy="62" r="4.6" fill="#e3a24f">
      <animate attributeName="r" values="3.8;5.4;3.8" dur="4.0s" begin="-3.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.72;1;0.72" dur="4.0s" begin="-3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="58" r="4.6" fill="#7de0ae">
      <animate attributeName="r" values="3.8;5.4;3.8" dur="4.0s" begin="-2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.72;1;0.72" dur="4.0s" begin="-2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="212" cy="56" r="4.6" fill="#e3a24f">
      <animate attributeName="r" values="3.8;5.4;3.8" dur="4.0s" begin="-1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.72;1;0.72" dur="4.0s" begin="-1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="66" r="4.6" fill="#7de0ae">
      <animate attributeName="r" values="3.8;5.4;3.8" dur="4.0s" begin="-0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.72;1;0.72" dur="4.0s" begin="-0.3s" repeatCount="indefinite"/>
    </circle>

    <!-- Traveler node gliding along exact retention path with smooth start/end fade -->
    <circle r="7.5" fill="#7de0ae">
      <animateMotion path="M 24 62 Q 48 104, 74 108 L 84 62 Q 112 92, 138 94 L 148 58 Q 176 80, 202 82 L 212 56 Q 242 65, 270 66" dur="4.0s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.34;0.34;0" keyTimes="0;0.06;0.94;1" dur="4.0s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.6" fill="#ebf2ee">
      <animateMotion path="M 24 62 Q 48 104, 74 108 L 84 62 Q 112 92, 138 94 L 148 58 Q 176 80, 202 82 L 212 56 Q 242 65, 270 66" dur="4.0s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="4.0s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Interval labels (13px mono) -->
    <text x="84" y="180" text-anchor="middle" fill="#8da399" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">D1</text>
    <text x="148" y="180" text-anchor="middle" fill="#8da399" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">D3</text>
    <text x="212" y="180" text-anchor="middle" fill="#8da399" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">D7</text>
    <text x="270" y="180" text-anchor="middle" fill="#8da399" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">D21</text>
  </g>
</svg>
