<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 184" width="880" height="184" role="img" aria-labelledby="anki-dark-title">
  <title id="anki-dark-title">Repositorio público Vicentoex/Anki: Anki Prompt y Anki Tarjet Script con curva animada de repetición espaciada</title>
  <rect x="0.5" y="0.5" width="879" height="183" rx="16" fill="#0c1311" stroke="#26322e" stroke-width="1"/>

  <!-- Left Info Side (~55%) -->
  <g transform="translate(24, 22)">
    <!-- Pill badge -->
    <rect x="0.5" y="0.5" width="248" height="26" rx="13" fill="#121c19" stroke="#2c3d37" stroke-width="1"/>
    <circle cx="16" cy="13.5" r="3.6" fill="#7de0ae">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17.5" fill="#a6b9b0" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">REPOSITORIO PÚBLICO · ACTIVO</text>

    <!-- Title -->
    <text x="0" y="58" fill="#ebf2ee" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700">Vicentoex / Anki</text>

    <!-- 2-line description -->
    <text x="0" y="84" fill="#b4c6bd" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5">Anki Prompt y Anki Tarjet Script — plantillas de prompts y</text>
    <text x="0" y="104" fill="#b4c6bd" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5">scripts para generar tarjetas de recuerdo activo.</text>

    <!-- Bottom row: Stack + CTA -->
    <text x="0" y="136" fill="#8da399" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">Markdown · Python · Repetición espaciada</text>
    <text x="456" y="136" text-anchor="end" fill="#7de0ae" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700">Ver repositorio →</text>
  </g>

  <!-- Right Retention Curve Side (~45%) -->
  <g transform="translate(504, 18)">
    <rect x="0.5" y="0.5" width="352" height="147" rx="12" fill="#121c19" stroke="#26322e" stroke-width="1"/>
    <text x="16" y="23" fill="#a6b9b0" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">RETENCIÓN · REPASO ESPACIADO</text>

    <!-- Baseline grid -->
    <line x1="20" y1="118" x2="332" y2="118" stroke="#22302b" stroke-width="1"/>
    <line x1="20" y1="54" x2="332" y2="54" stroke="#1b2622" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- Faint forgetting curve (decaying without review) -->
    <path d="M 24 44 C 70 86, 150 108, 326 115" fill="none" stroke="#475952" stroke-width="1.4" stroke-dasharray="3 4"/>

    <!-- Reinforced spaced-repetition retention wave: D1 -> D3 -> D7 -> D21 -->
    <path d="M 24 44 Q 44 74, 66 76 L 74 44 Q 106 66, 140 68 L 148 42 Q 186 58, 224 60 L 232 41 Q 278 50, 326 51"
      fill="none" stroke="#5cbf8f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sequential recall spike vertical guides -->
    <line x1="70" y1="44" x2="70" y2="118" stroke="#26322e" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="144" y1="42" x2="144" y2="118" stroke="#26322e" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="228" y1="41" x2="228" y2="118" stroke="#26322e" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="326" y1="51" x2="326" y2="118" stroke="#26322e" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Sequential pulsing recall nodes at D1, D3, D7, D21 -->
    <circle cx="70" cy="44" r="4.2" fill="#e3a24f">
      <animate attributeName="r" values="3.2;5.2;3.2" dur="4.0s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4.0s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="144" cy="42" r="4.2" fill="#7de0ae">
      <animate attributeName="r" values="3.2;5.2;3.2" dur="4.0s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4.0s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="228" cy="41" r="4.2" fill="#e3a24f">
      <animate attributeName="r" values="3.2;5.2;3.2" dur="4.0s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4.0s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="326" cy="51" r="4.2" fill="#7de0ae">
      <animate attributeName="r" values="3.2;5.2;3.2" dur="4.0s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4.0s" begin="3.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Traveler node gliding continuously along the retention wave -->
    <circle r="7" fill="#7de0ae" opacity="0.32">
      <animateMotion path="M 24 44 Q 44 74, 66 76 L 74 44 Q 106 66, 140 68 L 148 42 Q 186 58, 224 60 L 232 41 Q 278 50, 326 51" dur="4.0s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.4" fill="#ebf2ee">
      <animateMotion path="M 24 44 Q 44 74, 66 76 L 74 44 Q 106 66, 140 68 L 148 42 Q 186 58, 224 60 L 232 41 Q 278 50, 326 51" dur="4.0s" repeatCount="indefinite"/>
    </circle>

    <!-- Interval labels -->
    <text x="70" y="135" text-anchor="middle" fill="#8da399" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">D1</text>
    <text x="144" y="135" text-anchor="middle" fill="#8da399" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">D3</text>
    <text x="228" y="135" text-anchor="middle" fill="#8da399" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">D7</text>
    <text x="326" y="135" text-anchor="middle" fill="#8da399" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">D21</text>
  </g>
</svg>
