<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="pillars-light-title">
  <title id="pillars-light-title">Cuatro líneas de intersección: Educación y Aprendizaje, Neuropsicología, IA aplicada y RRHH</title>
  <rect x="0.5" y="0.5" width="799" height="439" rx="16" fill="#f2f5f3" stroke="#cfd8d4" stroke-width="1"/>

  <!-- Header -->
  <circle cx="28" cy="30" r="3.5" fill="#1f6e4a"/>
  <text x="41" y="34" fill="#42504a" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="0.6">MAPA DE DOMINIOS · INTERSECCIÓN APLICADA</text>
  <text x="776" y="34" text-anchor="end" fill="#4a5953" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">01 — 04</text>
  <line x1="22" y1="52" x2="778" y2="52" stroke="#dce3df" stroke-width="1"/>

  <!-- Card 01: Educación y Aprendizaje -->
  <g transform="translate(22, 70)">
    <rect x="0.5" y="0.5" width="369" height="170" rx="12" fill="#ffffff" stroke="#cfd8d4" stroke-width="1"/>
    <text x="22" y="30" fill="#1f6e4a" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">01 · APRENDIZAJE</text>
    <g transform="translate(322, 16)" fill="none" stroke="#1f6e4a" stroke-width="1.6" stroke-linecap="round">
      <path d="M2 15 C7 4, 15 4, 20 15"/>
      <path d="M11 15 C15 7, 22 7, 26 15" stroke="#2a865b" opacity="0.9"/>
      <circle cx="2" cy="15" r="1.8" fill="#1f6e4a" stroke="none"/>
      <circle cx="20" cy="15" r="1.8" fill="#1f6e4a" stroke="none"/>
    </g>
    <text x="22" y="64" fill="#16201c" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20.5" font-weight="700">Educación y Aprendizaje</text>
    <line x1="22" y1="78" x2="60" y2="78" stroke="#1f6e4a" stroke-width="2" stroke-linecap="round"/>
    <text x="22" y="104" fill="#3a4741" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5">Repetición espaciada, recuerdo activo y diseño</text>
    <text x="22" y="124" fill="#3a4741" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5">instruccional para consolidar conceptos complejos.</text>
    <text x="22" y="152" fill="#4a5953" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">Anki · Aprendizaje</text>
  </g>

  <!-- Card 02: Neuropsicología -->
  <g transform="translate(409, 70)">
    <rect x="0.5" y="0.5" width="369" height="170" rx="12" fill="#ffffff" stroke="#cfd8d4" stroke-width="1"/>
    <text x="22" y="30" fill="#1f6e4a" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">02 · COGNICIÓN</text>
    <g transform="translate(322, 16)" fill="none" stroke="#1f6e4a" stroke-width="1.5">
      <line x1="4" y1="13" x2="14" y2="5"/>
      <line x1="4" y1="13" x2="16" y2="17"/>
      <line x1="14" y1="5" x2="25" y2="11"/>
      <line x1="16" y1="17" x2="25" y2="11"/>
      <circle cx="4" cy="13" r="2.3" fill="#1f6e4a" stroke="none"/>
      <circle cx="14" cy="5" r="2.1" fill="#8a5a0e" stroke="none"/>
      <circle cx="16" cy="17" r="2.1" fill="#1f6e4a" stroke="none"/>
      <circle cx="25" cy="11" r="2.3" fill="#1f6e4a" stroke="none"/>
    </g>
    <text x="22" y="64" fill="#16201c" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20.5" font-weight="700">Neuropsicología</text>
    <line x1="22" y1="78" x2="60" y2="78" stroke="#1f6e4a" stroke-width="2" stroke-linecap="round"/>
    <text x="22" y="104" fill="#3a4741" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5">Atención, memoria y carga cognitiva como</text>
    <text x="22" y="124" fill="#3a4741" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5">criterio empírico al diseñar cada flujo.</text>
    <text x="22" y="152" fill="#4a5953" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">Base · Criterio</text>
  </g>

  <!-- Card 03: IA aplicada -->
  <g transform="translate(22, 254)">
    <rect x="0.5" y="0.5" width="369" height="170" rx="12" fill="#ffffff" stroke="#cfd8d4" stroke-width="1"/>
    <text x="22" y="30" fill="#8a5a0e" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">03 · WORKFLOWS</text>
    <g transform="translate(322, 16)" fill="none" stroke="#8a5a0e" stroke-width="1.6" stroke-linecap="round">
      <rect x="2" y="4" width="8" height="8" rx="2"/>
      <rect x="18" y="11" width="8" height="8" rx="2" stroke="#1f6e4a"/>
      <path d="M10 8 C15 8, 13 15, 18 15" stroke="#516059"/>
    </g>
    <text x="22" y="64" fill="#16201c" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20.5" font-weight="700">IA aplicada</text>
    <line x1="22" y1="78" x2="60" y2="78" stroke="#8a5a0e" stroke-width="2" stroke-linecap="round"/>
    <text x="22" y="104" fill="#3a4741" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5">Prompts estructurados y scripts legibles para</text>
    <text x="22" y="124" fill="#3a4741" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5">reducir fricción en tareas de síntesis.</text>
    <text x="22" y="152" fill="#4a5953" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">Prompts · Python</text>
  </g>

  <!-- Card 04: RRHH -->
  <g transform="translate(409, 254)">
    <rect x="0.5" y="0.5" width="369" height="170" rx="12" fill="#ffffff" stroke="#cfd8d4" stroke-width="1"/>
    <text x="22" y="30" fill="#1f6e4a" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">04 · ORGANIZACIÓN</text>
    <g transform="translate(322, 16)" fill="none" stroke="#1f6e4a" stroke-width="1.5">
      <circle cx="14" cy="5" r="2.8"/>
      <circle cx="5" cy="16" r="2.3" stroke="#516059"/>
      <circle cx="23" cy="16" r="2.3" stroke="#516059"/>
      <path d="M7.4 14.2 L11.8 7.5 M20.6 14.2 L16.2 7.5 M7.8 16.2 L20.2 16.2" stroke="#687670" stroke-width="1.2"/>
    </g>
    <text x="22" y="64" fill="#16201c" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20.5" font-weight="700">RRHH</text>
    <line x1="22" y1="78" x2="60" y2="78" stroke="#1f6e4a" stroke-width="2" stroke-linecap="round"/>
    <text x="22" y="104" fill="#3a4741" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5">Transferencia de evidencia conductual al</text>
    <text x="22" y="124" fill="#3a4741" font-family="'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5">desarrollo de talento y formación aplicada.</text>
    <text x="22" y="152" fill="#4a5953" font-family="'Fira Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">People Analytics · L&amp;D</text>
  </g>
</svg>
